name: Controller TUI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Download pinned dependencies
        run: GOWORK=off go mod download
      - name: Install commands into temporary GOBIN
        run: |
          export GOBIN="$RUNNER_TEMP/uecho-bin"
          make install
          for command in uechoctl uechopost uechosearch uechotui uecholight uechobench; do
            test -x "$GOBIN/$command"
          done
          "$GOBIN/uechosearch" -h
          "$GOBIN/uechotui" --help
          "$GOBIN/uechoctl" tui --help
          status=0
          "$GOBIN/uechopost" > "$RUNNER_TEMP/uechopost-help.txt" || status=$?
          test "$status" -eq 1
          grep -q "Usage : uechopost" "$RUNNER_TEMP/uechopost-help.txt"
      - name: Offline UI, correlation, race and portable builds
        run: make tui-check
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: uecho-go
      - uses: actions/checkout@v7
        with:
          repository: cybergarage/uecho-simulator
          ref: v1.0.0
          path: simulator
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Prepare modules and released simulator
        run: |
          GOWORK=off go -C uecho-go mod download
          GOWORK=off go -C simulator build -o "$RUNNER_TEMP/uecho-simulator-v1" ./cmd/uecho-simulator
      - name: Isolated loopback + multicast controller and v1.0.0 device
        run: |
          sudo unshare --net -- bash -eu -c '
            ip link set lo up
            ip link add simtest0 type dummy
            ip addr add 192.0.2.10/24 dev simtest0
            ip addr add 192.0.2.20/24 dev simtest0
            ip link set simtest0 multicast on
            ip link set simtest0 up
            ip route add 224.0.0.0/4 dev simtest0
            cd "$1"
            export GOWORK=off GOPROXY=off GOTOOLCHAIN=local GOMODCACHE="$2" GOCACHE="$3" UECHOTUI_SIMULATOR_V1="$4" UECHOTUI_ISOLATED_MULTICAST=1
            "$5" test -race -count=1 -v ./internal/tui/controller ./internal/tui/dashboard -run "TestSimulator(Loopback|Multicast|UIEnumToDisplay)"
          ' -- "$GITHUB_WORKSPACE/uecho-go" "$(go env GOMODCACHE)" "$RUNNER_TEMP/tui-go-cache" "$RUNNER_TEMP/uecho-simulator-v1" "$(command -v go)"
